plugins {
    id 'java'
    id 'maven-publish'   
    id 'kr.entree.spigradle' version '2.2.4'
    id 'com.github.johnrengelman.shadow' version '7.0.0'
    id 'io.freefair.lombok' version '6.1.0'
}

group = 'net.aleiv'
version = '0.1-SNAPSHOT'

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(16)
    }
}

javadoc {
    options.encoding = 'UTF-8'
}

repositories {
    google()
    mavenLocal()
    mavenCentral()
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { 
        name = 'jitpack.io'
        url = 'https://jitpack.io' 
    }
    maven { url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://libraries.minecraft.net/' }
    maven { url 'https://plugins.gradle.org/m2' }
    maven { url 'https://repo.aikar.co/content/groups/aikar/' }
    maven { url 'https://repo.loohpjames.com/repository/' }
}

dependencies {
    // Spigot / Paper API
    compileOnly files('libs/paper-api-1.16.5-R0.1-SNAPSHOT.jar')
    compileOnly 'org.bukkit:craftbukkit:1.16.5-R0.1-SNAPSHOT'
    implementation files('libs/npc-lib-bukkit-3.0.0-beta7.jar')

    // Explicit local NPCLib JAR references matching your filenames
    implementation files('libs/npc-lib-common-3.0.0-beta7.jar')
    implementation files('libs/geantyref-1.3.13.jar')
    implementation 'io.papermc:paperlib:1.0.7'


    // Automatically include any other local JARs in libs/
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Other required plugin dependencies
    implementation 'us.jcedeno:znpc-servers:1.0.3.2'
    compileOnly group: "com.comphenix.protocol", name: "ProtocolLib", version: "4.7.0"

    // MiniMessage & Utilities
    implementation 'net.kyori:adventure-api:4.10.0'
    implementation 'net.md-5:bungeecord-chat:1.16-R0.4'
    implementation 'com.google.code.gson:gson:2.8.9'
}

spigot {
    authors 'aleiv'
    apiVersion '1.16'
    version '0.1'
    name 'SquidGame'
    load STARTUP
    depends 'ProtocolLib'
}

shadowJar {
    relocate 'co.aikar.commands', 'shadded.acf'
    relocate 'co.aikar.locales', 'shadded.acf.locales'
    relocate 'acf-minecraft_', 'shadded.acf.properties.acf-minecraft_'
    relocate 'acf-core_', 'shadded.acf.properties.acf-core_'
    relocate 'de.slikey', 'shadded.squidgame.lib.particles'
}

build.dependsOn shadowJar
